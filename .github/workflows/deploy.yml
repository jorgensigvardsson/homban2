# Builds the api/web images, runs the test suite, and — only if that all
# passes — ships the images to the self-hosted server as tarballs (no
# registry involved) and restarts it via docker compose.
#
# Requires these repository secrets (Settings -> Secrets and variables ->
# Actions), documented in more detail in README.md:
#   DEPLOY_SSH_HOST           hostname or IP of the Docker server
#   DEPLOY_SSH_PORT           SSH port (optional; defaults to 22)
#   DEPLOY_SSH_USER           SSH user on that server
#   DEPLOY_SSH_PRIVATE_KEY    private key for that user (key-based auth only)
#   DEPLOY_PATH               directory on that server holding docker-compose.yml
#                             and .env for this project
#
# The server's docker-compose.yml is not touched by this workflow (it is
# managed by hand); it must already tag its services `homban2-api:latest`
# and `homban2-web:latest` to match what gets loaded here — see the "image:"
# lines in this repo's docker-compose.yml.
name: Deploy

on:
  push:
    branches: [deploy]

jobs:
  deploy:
    name: Build, test, and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend/proxy dependencies
        run: npm ci

      - name: Typecheck frontend and proxy, vet backend
        run: npm run check

      - name: Run backend tests
        run: npm test

      - name: Build backend image
        run: docker build -t homban2-api:latest backend

      - name: Build frontend image
        run: docker build -t homban2-web:latest -f frontend/Dockerfile .

      - name: Export images to a tarball
        run: docker save -o /tmp/homban2-images.tar homban2-api:latest homban2-web:latest

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Copy image tarball to the server
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -P "${SSH_PORT:-22}" \
            /tmp/homban2-images.tar \
            "$SSH_USER@$SSH_HOST:/tmp/homban2-images.tar"

      - name: Load images and restart services
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" bash -s <<EOF
          set -e
          docker load -i /tmp/homban2-images.tar
          rm -f /tmp/homban2-images.tar
          cd "$DEPLOY_PATH"
          docker compose up -d --no-build
          docker image prune -f
          EOF

      - name: Clean up local key
        if: always()
        run: rm -f ~/.ssh/deploy_key
