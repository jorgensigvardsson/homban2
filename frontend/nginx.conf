# Single-origin gateway: the browser only ever sees this container, or
# whatever TLS-terminating reverse proxy sits in front of it on the network.
# Static assets at "/", the Go API at "/api/*", same origin for both so the
# frontend can call relative paths with no CORS.
#
# This container never terminates TLS itself: nginx only ever speaks plain
# HTTP, both to the browser-facing reverse proxy and to "api".

# The reverse proxy in front should set X-Forwarded-Proto itself (most do by
# default); this only falls back to "http" (this container's own scheme) if a
# request somehow arrives without one.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # If the reverse proxy's address is fixed, uncomment these two lines and
    # set it to that address (or subnet) so $remote_addr / X-Forwarded-For
    # reflect the real client instead of the proxy hop:
    #   set_real_ip_from  203.0.113.10;
    #   real_ip_header    X-Forwarded-For;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri /index.html;
    }
}
